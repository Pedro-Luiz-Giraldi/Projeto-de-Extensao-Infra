AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Template for DataBase Components (RDS and S3 - DataLake)

Parameters:
  DBUsername:
    Description: Usuario master do banco de dados RDS
    Type: String
    Default: dbadmin
    MinLength: "4"
    MaxLength: "16"
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9]*$"

  DBPassword:
    Description: Senha master do banco de dados RDS
    Type: String
    NoEcho: true
    MinLength: "8"
    MaxLength: "41"
    Default: AdminPassword123!

Resources:

  # =========================================================
  # S3 - LOGS
  # =========================================================

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-Registros-de-Logs
        - Key: Purpose
          Value: Logs


  # =========================================================
  # S3 - DATALAKE BRONZE
  # =========================================================

  BronzeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-DataLake-Bronze
        - Key: Purpose
          Value: DataLake-Bronze
        - Key: Layer
          Value: Bronze


  # =========================================================
  # S3 - DATALAKE SILVER
  # =========================================================

  SilverBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-DataLake-Silver
        - Key: Purpose
          Value: DataLake-Silver
        - Key: Layer
          Value: Silver


  # =========================================================
  # S3 - DATALAKE GOLD
  # =========================================================

  GoldBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-DataLake-Gold
        - Key: Purpose
          Value: DataLake-Gold
        - Key: Layer
          Value: Gold


  # =========================================================
  # RDS SUBNET GROUP
  # =========================================================

  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets privadas utilizadas pelo RDS
      SubnetIds:
        - Fn::ImportValue: Network-PrivateSubnet1Id
        - Fn::ImportValue: Network-PrivateSubnet2Id

      Tags:
        - Key: Name
          Value: RDS-SubnetGroup


  # =========================================================
  # RDS DATABASE
  # =========================================================

  RDSDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: banco-principal
      Engine: mysql
      EngineVersion: "8.4"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: appdb

      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword

      VPCSecurityGroups:
        - Fn::ImportValue: Network-DBSecurityGroupId

      DBSubnetGroupName: !Ref RDSSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      MultiAZ: false
      DeletionProtection: false

      Tags:
        - Key: Name
          Value: RDS-Banco-Principal


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  # -------------------------
  # LOG BUCKET
  # -------------------------

  LogBucketName:
    Description: Nome do bucket utilizado para armazenamento de logs
    Value: !Ref LogBucket
    Export:
      Name: Database-LogBucketName

  LogBucketArn:
    Description: ARN do bucket de logs
    Value: !GetAtt LogBucket.Arn
    Export:
      Name: Database-LogBucketArn


  # -------------------------
  # BRONZE
  # -------------------------

  BronzeBucketName:
    Description: Nome do bucket DataLake Bronze
    Value: !Ref BronzeBucket
    Export:
      Name: Database-BronzeBucketName

  BronzeBucketArn:
    Description: ARN do bucket DataLake Bronze
    Value: !GetAtt BronzeBucket.Arn
    Export:
      Name: Database-BronzeBucketArn


  # -------------------------
  # SILVER
  # -------------------------

  SilverBucketName:
    Description: Nome do bucket DataLake Silver
    Value: !Ref SilverBucket
    Export:
      Name: Database-SilverBucketName

  SilverBucketArn:
    Description: ARN do bucket DataLake Silver
    Value: !GetAtt SilverBucket.Arn
    Export:
      Name: Database-SilverBucketArn


  # -------------------------
  # GOLD
  # -------------------------

  GoldBucketName:
    Description: Nome do bucket DataLake Gold
    Value: !Ref GoldBucket
    Export:
      Name: Database-GoldBucketName

  GoldBucketArn:
    Description: ARN do bucket DataLake Gold
    Value: !GetAtt GoldBucket.Arn
    Export:
      Name: Database-GoldBucketArn


  # -------------------------
  # RDS
  # -------------------------

  RDSInstanceIdentifier:
    Description: Identificador da instancia RDS
    Value: !Ref RDSDatabase
    Export:
      Name: Database-RDSInstanceIdentifier

  RDSEndpoint:
    Description: Endpoint do banco de dados RDS
    Value: !GetAtt RDSDatabase.Endpoint.Address
    Export:
      Name: Database-RDSEndpoint

  RDSPort:
    Description: Porta utilizada pelo RDS
    Value: !GetAtt RDSDatabase.Endpoint.Port
    Export:
      Name: Database-RDSPort