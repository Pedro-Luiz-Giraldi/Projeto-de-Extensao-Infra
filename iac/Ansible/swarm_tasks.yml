---
- name: start docker swarm
  hosts: web_servers,app_servers
  become: true
  vars:
    manager_ip: "{{ hostvars[groups['web_servers'][0]]['ansible_facts']['default_ipv4']['address'] }}"
  tasks:

    - name: install python packages
      ansible.builtin.apt:
        name:
          - python3-docker
          - python3-jsondiff
        state: present
        update_cache: true

    - name: init swarm
      community.docker.docker_swarm:
        advertise_addr: "{{ manager_ip }}"
        default_addr_pool: 172.16.0.0/16
        state: present
      when: inventory_hostname == groups['web_servers'][0]
      register: swarm_info

    - name: join manager to swarm
      community.docker.docker_swarm:
        remote_addrs:
          - "{{ manager_ip }}"
        join_token: "{{ swarm_info.swarm_facts.JoinTokens.Manager }}"
        state: join
      when: inventory_hostname == groups['web_servers'][1]

    - name: join workers to swarm
      community.docker.docker_swarm:
        remote_addrs:
          - "{{ manager_ip }}"
        join_token: "{{ swarm_info.swarm_facts.JoinTokens.Worker }}"
        state: join
      when: inventory_hostname in groups['app_servers']



    - name: copy compose file to manager
      ansible.builtin.copy:
        src: ./swarm.yml
        dest: /opt/swarm.yml
        mode: '0644'
      when: inventory_hostname == groups['web_servers'][0]

    - name: copy env file to manager
      ansible.builtin.copy:
        src: ../../.env
        dest: /opt/.env
        mode: '0644'
      when: inventory_hostname == groups['web_servers'][0]

    - name: deploy stack
      community.docker.docker_stack:
        state: present
        name: sax
        compose:
          - /opt/swarm.yml
