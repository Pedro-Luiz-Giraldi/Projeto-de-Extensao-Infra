AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for Application Components (WebServers Ubuntu/Docker, Load Balancer and BackEndServers Ubuntu/Docker)

Parameters:
  InstanceType:
    Description: Tipo de instancia EC2 para os servidores Web e Back-End
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t2.micro
      - t3.small
    ConstraintDescription: Deve ser um tipo de instancia valido.

  AmiId:
    Description: ID da AMI do Ubuntu 24.04 LTS (us-east-1)
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  KeyName:
    Description: Nome do KeyPair para acesso SSH as instancias
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey

Resources:

  # =========================================================
  # APPLICATION LOAD BALANCER & TARGET GROUP
  # =========================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: ALB-Publico
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: Network-PublicSubnet1Id
        - Fn::ImportValue: Network-PublicSubnet2Id
      SecurityGroups:
        - Fn::ImportValue: Network-ALBSecurityGroupId
      Tags:
        - Key: Name
          Value: ALB-Publico
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: TG-WebServers
      Port: 80
      Protocol: HTTP
      VpcId: !ImportValue Network-VPCId
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      Targets:
        - Id: !Ref WebServer01
          Port: 80
        - Id: !Ref WebServer02
          Port: 80
      Tags:
        - Key: Name
          Value: TG-WebServers
        - Key: Project
          Value: Projeto-Extensao

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # =========================================================
  # WEB SERVERS (Ubuntu 24.04 + Docker)
  # =========================================================

  WebServer01:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !ImportValue Network-PublicSubnet1Id
      SecurityGroupIds:
        - !ImportValue Network-WebServerSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData: !Base64 |
        #!/bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get upgrade -y
        apt-get install -y docker.io
        systemctl start docker
        systemctl enable docker
        usermod -aG docker ubuntu
      Tags:
        - Key: Name
          Value: Web-Server 01
        - Key: Role
          Value: Frontend-WebServer
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  WebServer02:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !ImportValue Network-PublicSubnet2Id
      SecurityGroupIds:
        - !ImportValue Network-WebServerSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData: !Base64 |
        #!/bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get upgrade -y
        apt-get install -y docker.io
        systemctl start docker
        systemctl enable docker
        usermod -aG docker ubuntu
      Tags:
        - Key: Name
          Value: Web-Server 02
        - Key: Role
          Value: Frontend-WebServer
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # =========================================================
  # BACKEND SERVERS (Ubuntu 24.04 + Docker)
  # =========================================================

  Backend01:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !ImportValue Network-PrivateSubnet1Id
      SecurityGroupIds:
        - !ImportValue Network-BackendSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData: !Base64 |
        #!/bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get upgrade -y
        apt-get install -y docker.io
        systemctl start docker
        systemctl enable docker
        usermod -aG docker ubuntu
      Tags:
        - Key: Name
          Value: Back-End 01 (us-east-1a)
        - Key: Role
          Value: Backend
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  Backend02:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !ImportValue Network-PrivateSubnet2Id
      SecurityGroupIds:
        - !ImportValue Network-BackendSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData: !Base64 |
        #!/bin/bash
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get upgrade -y
        apt-get install -y docker.io
        systemctl start docker
        systemctl enable docker
        usermod -aG docker ubuntu
      Tags:
        - Key: Name
          Value: Back-End 02 (us-east-1b)
        - Key: Role
          Value: Backend
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

# =========================================================
# OUTPUTS
# =========================================================

Outputs:
  LoadBalancerDNS:
    Description: URL publica do Application Load Balancer
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: Application-LoadBalancerDNS

  WebServer01Id:
    Description: ID da instancia Web Server 01
    Value: !Ref WebServer01
    Export:
      Name: Application-WebServer01Id

  WebServer02Id:
    Description: ID da instancia Web Server 02
    Value: !Ref WebServer02
    Export:
      Name: Application-WebServer02Id

  Backend01Id:
    Description: ID da instancia Backend 01
    Value: !Ref Backend01
    Export:
      Name: Application-Backend01Id

  Backend02Id:
    Description: ID da instancia Backend 02
    Value: !Ref Backend02
    Export:
      Name: Application-Backend02Id