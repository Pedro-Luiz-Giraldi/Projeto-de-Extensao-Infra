services:

  database:
    image: pedrogiraldi/sax-db:5.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  backend:
    image: pedrogiraldi/sax-back:3.0
    environment:
      SERVER_PORT: ${SERVER_PORT}
      CLASSAPP_TOKEN: ${CLASSAPP_TOKEN}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_VALIDITY: ${JWT_VALIDITY}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EXCHANGE_NAME: ${EXCHANGE_NAME}
      QUEUE_NAME: ${QUEUE_NAME}
      ROUTING_KEY_NAME: ${ROUTING_KEY_NAME}
    ports:
      - "8081:8081"
    expose:
      - 8081
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/solicitacoes"]
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  frontend:
    image: pedrogiraldi/sax-front:3.0
    environment:
      BACKEND_HOST: ${BACKEND_HOST}
    ports:
      - "80:80"
    expose:
      - 80
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  alertas:
    image: pedrogiraldi/sax-alertas:1.0
    environment:
      MONOLITO_URL: http://backend:8081
      RABBIT_HOST: rabbitmq
    ports:
      - "8082:8082"
    expose:
      - 8082
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure


networks:
  sax-net:
    driver: overlay
