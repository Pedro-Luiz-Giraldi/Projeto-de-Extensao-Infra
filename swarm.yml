services:

  db:
    image: pedrogiraldi/sax-db:5.0
    env_file:
      ./.env
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  back:
    image: pedrogiraldi/sax-back:latest
    env_file:
      ./.env
    ports:
      - "8081:8081"
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  front:
    image: pedrogiraldi/sax-front:latest
    env_file:
      ./.env
    ports:
      - "80:80"
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      ./.env
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  alertas:
    image: pedrogiraldi/sax-alertas:latest
    env_file:
      ./.env
    ports:
      - "8082:8082"
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  ia:
    image: pedrogiraldi/sax-ia:latest
    env_file:
      ./.env
    ports:
      - "8080:8080"
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure


networks:
  sax-net:
    driver: overlay
