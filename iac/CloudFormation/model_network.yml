AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Template for Network Components (VPC, Subnets, InternetGateway, NATGateway, RouteTable and SecurityGroups)

# ----------------------- Setando Parâmetros de Criação ----------------------
Parameters:
  MyIP:
    Description: Endereco IP em formato CIDR para liberacao de acesso administrativo (SSH/HTTP)
    Type: String
    MinLength: "9"
    MaxLength: "18"
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: Deve ser um range CIDR valido (ex 203.0.113.1/32).
    
# --------------------- Criando e Conectando Componentes ---------------------
Resources:
  # Stack 1 - VPC and Internet Gateway
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/22
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC-Principal
  
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: IGW-Principal

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
    
  # Stack 2 - Public and Private Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/26
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Sub-net publica - 10.0.0.0/26 | us-east-1a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.64/26
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Sub-net publica - 10.0.0.64/26 | us-east-1b

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/26
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Sub-net privada - 10.0.2.0/26 | us-east-1a

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.64/26
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Sub-net privada - 10.0.2.64/26 | us-east-1b

  # Stack 3 - NAT Gateways and Elastic IPs
  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: NAT-Gateway-1a

  NatGateway2EIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway2EIP.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: NAT-Gateway-1b

  # Stack 4 - Route Table and Connections
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: RouteTable-Publica

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: RouteTable-Privada-1a

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: RouteTable-Privada-1b

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2
  
  # Stack 5 - Security Groups to Applications
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG para o Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MyIP
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-ALB

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG para os Servidores Web (Nginx/HTTP)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-WebServer

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG para os Servidores Back-End (Java)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
          Description: Acesso SSH para gestao
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-Backend

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG para o Servidor de Banco de Dados MySQL (EC2)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref BackendSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref WebServerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-EC2-Database
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # Stack 6 - Docker Swarm Rules (SG-WebServer)
  WebSwarmSelfClusterManagement:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: tcp
      FromPort: 2377
      ToPort: 2377
      Description: Docker Swarm - cluster_management (nos SG-WebServer)

  WebSwarmSelfNodeCommunicationTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_tcp (nos SG-WebServer)

  WebSwarmSelfNodeCommunicationUdp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_udp (nos SG-WebServer)

  WebSwarmSelfOverlayNetwork:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      Description: Docker Swarm - overlay_network (nos SG-WebServer)

  WebSwarmFromBackendClusterManagement:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 2377
      ToPort: 2377
      Description: Docker Swarm - cluster_management (nos SG-Backend)

  WebSwarmFromBackendNodeCommunicationTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_tcp (nos SG-Backend)

  WebSwarmFromBackendNodeCommunicationUdp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_udp (nos SG-Backend)

  WebSwarmFromBackendOverlayNetwork:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebServerSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      Description: Docker Swarm - overlay_network (nos SG-Backend)

  # Stack 7 - Docker Swarm Rules (SG-Backend)
  BackendSwarmSelfClusterManagement:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 2377
      ToPort: 2377
      Description: Docker Swarm - cluster_management (nos SG-Backend)

  BackendSwarmSelfNodeCommunicationTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_tcp (nos SG-Backend)

  BackendSwarmSelfNodeCommunicationUdp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_udp (nos SG-Backend)

  BackendSwarmSelfOverlayNetwork:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref BackendSecurityGroup
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      Description: Docker Swarm - overlay_network (nos SG-Backend)

  BackendSwarmFromWebClusterManagement:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: tcp
      FromPort: 2377
      ToPort: 2377
      Description: Docker Swarm - cluster_management (nos SG-WebServer)

  BackendSwarmFromWebNodeCommunicationTcp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: tcp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_tcp (nos SG-WebServer)

  BackendSwarmFromWebNodeCommunicationUdp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: udp
      FromPort: 7946
      ToPort: 7946
      Description: Docker Swarm - node_communication_udp (nos SG-WebServer)

  BackendSwarmFromWebOverlayNetwork:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BackendSecurityGroup
      SourceSecurityGroupId: !Ref WebServerSecurityGroup
      IpProtocol: udp
      FromPort: 4789
      ToPort: 4789
      Description: Docker Swarm - overlay_network (nos SG-WebServer)

# ---------------------- Setando Parâmetros de Conexão ---------------------
Outputs:
  VPCId:
    Description: ID da VPC principal
    Value: !Ref VPC
    Export:
      Name: Network-VPCId

  PublicSubnet1Id:
    Description: ID da subnet publica us-east-1a
    Value: !Ref PublicSubnet1
    Export:
      Name: Network-PublicSubnet1Id

  PublicSubnet2Id:
    Description: ID da subnet publica us-east-1b
    Value: !Ref PublicSubnet2
    Export:
      Name: Network-PublicSubnet2Id

  PrivateSubnet1Id:
    Description: ID da subnet privada us-east-1a
    Value: !Ref PrivateSubnet1
    Export:
      Name: Network-PrivateSubnet1Id

  PrivateSubnet2Id:
    Description: ID da subnet privada us-east-1b
    Value: !Ref PrivateSubnet2
    Export:
      Name: Network-PrivateSubnet2Id

  ALBSecurityGroupId:
    Description: Security Group do Application Load Balancer
    Value: !Ref ALBSecurityGroup
    Export:
      Name: Network-ALBSecurityGroupId

  WebServerSecurityGroupId:
    Description: Security Group dos servidores Web
    Value: !Ref WebServerSecurityGroup
    Export:
      Name: Network-WebServerSecurityGroupId

  BackendSecurityGroupId:
    Description: Security Group dos servidores Backend
    Value: !Ref BackendSecurityGroup
    Export:
      Name: Network-BackendSecurityGroupId

  DBSecurityGroupId:
    Description: Security Group do Servidor de Banco de Dados MySQL
    Value: !Ref DBSecurityGroup
    Export:
      Name: Network-DBSecurityGroupId