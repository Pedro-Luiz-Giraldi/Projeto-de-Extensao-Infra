---
- name: start docker swarm
  hosts: web_servers,app_servers
  become: true
  vars:
    manager_ip: "{{ hostvars[groups['web_servers'][0]]['ansible_facts']['default_ipv4']['address'] }}"
    manager_token: "{{ hostvars[groups['web_servers'][0]].swarm_info.swarm_facts.JoinTokens.Manager }}"
    worker_token: "{{ hostvars[groups['web_servers'][0]].swarm_info.swarm_facts.JoinTokens.Worker }}"
  tasks:

    - name: install python packages
      ansible.builtin.apt:
        name:
          - python3-docker
          - python3-jsondiff
        state: present
        update_cache: true

    - name: init swarm
      community.docker.docker_swarm:
        advertise_addr: "{{ manager_ip }}"
        default_addr_pool: 172.16.0.0/16
        state: present
      when: inventory_hostname == groups['web_servers'][0]
      register: swarm_info

    - name: join manager to swarm
      community.docker.docker_swarm:
        remote_addrs:
          - "{{ manager_ip }}"
        join_token: "{{ manager_token }}"
        state: join
      when: inventory_hostname == groups['web_servers'][1]

    - name: join workers to swarm
      community.docker.docker_swarm:
        remote_addrs:
          - "{{ manager_ip }}"
        join_token: "{{ worker_token }}"
        state: join
      when: inventory_hostname in groups['app_servers']
