[SERVICE]
    flush        1
    daemon       Off
    log_level    info
    parsers_file parsers.conf

# ==========================================
# 1. INPUTS (Fontes de Log)
# ==========================================

[INPUT]
    name             tail
    tag              system.auth
    path             /var/log/auth.log
    Mem_Buf_Limit    5MB
    Refresh_Interval 5

[INPUT]
    name             tail
    tag              app.docker
    path             /var/lib/docker/containers/*/*.log	
    Mem_Buf_Limit    5MB
    Refresh_Interval 5

# ==========================================
# 2. OUTPUTS (Destinos no S3)
# ==========================================


[OUTPUT]
    name            s3
    match           system.auth
    region          us-east-1
    bucket          sax-database-logbucket-bfe6uu07rhql
    total_file_size 10M
    upload_timeout  5m
    use_put_object  On
    compression     gzip
    s3_key_format   /logs/system_auth/%Y/%m/%d/$TAG-$UUID.json.gz

[OUTPUT]
    name            s3
    match           app.docker
    region          us-east-1
    bucket          sax-database-logbucket-bfe6uu07rhql
    total_file_size 10M
    upload_timeout  5m
    use_put_object  On
    compression     gzip
    s3_key_format   /logs/docker/%Y/%m/%d/$TAG-$UUID.json.gz
