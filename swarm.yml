services:

  db:
    image: pedrogiraldi/sax-db:5.0
    env_file:
      ./.env
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  back:
    image: pedrogiraldi/sax-back:4.0
    env_file:
      ./.env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://sax_db:3306/sax_bd"
    ports:
      - "8081:8081"
    expose:
      - 8081
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/solicitacoes"]
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  front:
    image: pedrogiraldi/sax-front:4.0
    env_file:
      ./.env
    ports:
      - "80:80"
    expose:
      - 80
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure


  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      ./.env
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  alertas:
    image: pedrogiraldi/sax-alertas:4.0
    env_file:
      ./.env
    ports:
      - "8082:8082"
    expose:
      - 8082
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure

  ia:
    image: pedrogiraldi/sax-ia:4.0
    env_file:
      ./.env
    ports:
      - "8080:8080"
    expose:
      - 8080
    networks:
      - sax-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: on-failure


networks:
  sax-net:
    driver: overlay
