AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation Template for DataBase Components (EC2 MySQL and S3 DataLake)

Parameters:
  InstanceType:
    Description: Tipo de instancia EC2 para o servidor MySQL
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    ConstraintDescription: Deve ser um tipo de instancia valido.

  AmiId:
    Description: ID da AMI do Ubuntu 24.04 LTS (us-east-1)
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  KeyName:
    Description: Nome do KeyPair para acesso SSH a instancia
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey

Resources:

  # =========================================================
  # S3 - LOGS
  # =========================================================

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-Registros-de-Logs
        - Key: Purpose
          Value: Logs
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # =========================================================
  # S3 - SCRIPTS DO GLUE
  # =========================================================

  GlueScriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-Glue-Scripts
        - Key: Purpose
          Value: Glue-Scripts
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # =========================================================
  # S3 - DATALAKE BRONZE
  # =========================================================

  BronzeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-DataLake-Bronze
        - Key: Purpose
          Value: DataLake-Bronze
        - Key: Layer
          Value: Bronze
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # =========================================================
  # S3 - DATALAKE SILVER
  # =========================================================

  SilverBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-DataLake-Silver
        - Key: Purpose
          Value: DataLake-Silver
        - Key: Layer
          Value: Silver
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # =========================================================
  # S3 - DATALAKE GOLD
  # =========================================================

  GoldBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: S3-DataLake-Gold
        - Key: Purpose
          Value: DataLake-Gold
        - Key: Layer
          Value: Gold
        - Key: Project
          Value: Projeto-Extensao
        - Key: Environment
          Value: Production

  # =========================================================
  # DATABASE INSTANCE (EC2 - Ubuntu 24.04 com MySQL nativo)
  # =========================================================

  DatabaseInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      KeyName: !Ref KeyName
      SubnetId:
        Fn::ImportValue: Network-PrivateSubnet1Id
      SecurityGroupIds:
        - Fn::ImportValue: Network-DBSecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData: !Base64 |
        #!/bin/bash
        set -e

        # Atualizacao de pacotes do sistema
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get upgrade -y

        # Instalacao do MySQL Server nativo
        apt-get install -y mysql-server

        # Permitir conexoes de rede privada (bind 0.0.0.0)
        sed -i 's/^bind-address\s*=.*/bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf
        sed -i 's/^mysqlx-bind-address\s*=.*/mysqlx-bind-address = 0.0.0.0/' /etc/mysql/mysql.conf.d/mysqld.cnf 2>/dev/null || true

        # Reiniciar e habilitar o servico MySQL
        systemctl restart mysql
        systemctl enable mysql

      Tags:
        - Key: Name
          Value: EC2-Database-MySQL
        - Key: Environment
          Value: Production
        - Key: Role
          Value: Database
        - Key: Project
          Value: Projeto-Extensao

# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  # -------------------------
  # LOG BUCKET
  # -------------------------

  LogBucketName:
    Description: Nome do bucket utilizado para armazenamento de logs
    Value: !Ref LogBucket
    Export:
      Name: Database-LogBucketName

  LogBucketArn:
    Description: ARN do bucket de logs
    Value: !GetAtt LogBucket.Arn
    Export:
      Name: Database-LogBucketArn

  # -------------------------
  # GLUE SCRIPTS
  # -------------------------

  GlueScriptsBucketName:
    Description: Nome do bucket que guarda os scripts dos Glue Jobs
    Value: !Ref GlueScriptsBucket
    Export:
      Name: Database-GlueScriptsBucketName

  GlueScriptsBucketArn:
    Description: ARN do bucket de scripts do Glue
    Value: !GetAtt GlueScriptsBucket.Arn
    Export:
      Name: Database-GlueScriptsBucketArn

  # -------------------------
  # BRONZE
  # -------------------------

  BronzeBucketName:
    Description: Nome do bucket DataLake Bronze
    Value: !Ref BronzeBucket
    Export:
      Name: Database-BronzeBucketName

  BronzeBucketArn:
    Description: ARN do bucket DataLake Bronze
    Value: !GetAtt BronzeBucket.Arn
    Export:
      Name: Database-BronzeBucketArn

  # -------------------------
  # SILVER
  # -------------------------

  SilverBucketName:
    Description: Nome do bucket DataLake Silver
    Value: !Ref SilverBucket
    Export:
      Name: Database-SilverBucketName

  SilverBucketArn:
    Description: ARN do bucket DataLake Silver
    Value: !GetAtt SilverBucket.Arn
    Export:
      Name: Database-SilverBucketArn

  # -------------------------
  # GOLD
  # -------------------------

  GoldBucketName:
    Description: Nome do bucket DataLake Gold
    Value: !Ref GoldBucket
    Export:
      Name: Database-GoldBucketName

  GoldBucketArn:
    Description: ARN do bucket DataLake Gold
    Value: !GetAtt GoldBucket.Arn
    Export:
      Name: Database-GoldBucketArn

  # -------------------------
  # DATABASE EC2
  # -------------------------

  DatabaseInstanceId:
    Description: ID da instancia EC2 do banco de dados MySQL
    Value: !Ref DatabaseInstance
    Export:
      Name: Database-InstanceId

  DatabasePrivateIp:
    Description: IP privado da instancia de banco de dados MySQL
    Value: !GetAtt DatabaseInstance.PrivateIp
    Export:
      Name: Database-PrivateIp

  DatabasePort:
    Description: Porta utilizada pelo MySQL
    Value: "3306"
    Export:
      Name: Database-Port