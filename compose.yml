services:

  db:
    image: pedrogiraldi/sax-db:5.0
    env_file:
      ./.env
    networks:
      sax-net:
        aliases:
          - sax_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  back:
    image: pedrogiraldi/sax-back:latest
    env_file:
      ./.env
    ports:
      - "8081:8081"
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://localhost:8081/v1/limites"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true

  front:
    image: pedrogiraldi/sax-front:latest
    env_file:
      ./.env
    ports:
      - "80:80"
    networks:
      - sax-net
    depends_on:
      back:
        condition: service_healthy
        restart: true
      ia:
        condition: service_healthy
        restart: true

  ia:
    image: pedrogiraldi/sax-ia:latest
    env_file:
      ./.env
    ports:
      - "8080:8080"
    networks:
      - sax-net
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://localhost:8080/ia/talk"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      ./.env
    networks:
      - sax-net
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  alertas:
    image: pedrogiraldi/sax-alertas:latest
    env_file:
      ./.env
    ports:
      - "8082:8082"
    networks:
      - sax-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "5", "http://localhost:8082"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      back:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true

networks:
  sax-net:
    driver: bridge
